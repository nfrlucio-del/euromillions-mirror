name: Update EuroMillions data

on:
  schedule:
    # Diariamente as 06:00 UTC. Apanha os sorteios da noite anterior:
    # EuroMilhoes (terca e sexta) e EuroDreams (segunda e quinta).
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite correr a mao no separador Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar em.json e ed.json a partir das fontes
        run: python3 build_data.py

      - name: Commit se houver alteracoes
        run: |
          if [ -n "$(git status --porcelain em.json ed.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add em.json ed.json
            git commit -m "chore: atualizar dados EuroMilhoes/EuroDreams ($(date -u +%Y-%m-%d))"
            git push
            echo "dados atualizados e enviados."
          else
            echo "Sem alteracoes."
          fi
