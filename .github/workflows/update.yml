name: Update EuroMillions data

on:
  schedule:
    # De 3 em 3 horas. Os sorteios (EM terca/sexta, ED segunda/quinta) sao a noite; uma unica
    # corrida diaria era atrasada pelo GitHub para ~13h UTC e deixava a app sem o sorteio de
    # manha. Assim o sorteio entra na mesma noite/madrugada. Sem alteracoes = sem commit.
    - cron: "23 */3 * * *"
  workflow_dispatch: {}   # permite correr a mao no separador Actions
  push:                   # corre logo quando o script ou o workflow mudam
    branches: [main]
    paths: [build_data.py, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar em.json e ed.json a partir das fontes
        run: python3 build_data.py

      - name: Commit se houver alteracoes
        if: always()   # grava o jogo que correu bem mesmo que o outro tenha falhado
        run: |
          if [ -n "$(git status --porcelain em.json ed.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add em.json ed.json
            git commit -m "chore: atualizar dados EuroMilhoes/EuroDreams ($(date -u +%Y-%m-%d))"
            git push
            echo "dados atualizados e enviados."
          else
            echo "Sem alteracoes."
          fi
